version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Caché Distribuida en Memoria (Redis 7) - ADR-002
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transporte_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - transporte_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 2. Base de Datos Relacional Principal (PostgreSQL 16)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: transporte_postgres
    environment:
      POSTGRES_DB: cooperativa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooperativa_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - transporte_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 3. Módulo de Caché y Lectura (Monolito Modular - Spring Boot)
  # --------------------------------------------------------------------------
  api-cache-lecturas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transporte_api_cache
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cooperativa_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - CACHE_SILLAS_TTL_SECONDS=240
      - CACHE_VIAJES_TTL_SECONDS=300
      - CACHE_LOCK_TIMEOUT_MILLIS=5000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/cache/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - transporte_net
    restart: unless-stopped

networks:
  transporte_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
