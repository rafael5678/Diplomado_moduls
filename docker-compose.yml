version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Caché Distribuida en Memoria (Redis 7) - ADR-002
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transporte_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - transporte_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 2. Base de Datos Relacional Principal (PostgreSQL 16)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: transporte_postgres
    environment:
      POSTGRES_DB: cooperativa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooperativa_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - transporte_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 3. Réplicas del Módulo de Transporte (Alta Disponibilidad Multi-Nodo - ADR-001)
  # --------------------------------------------------------------------------
  api-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transporte_api_node_1
    environment:
      - INSTANCE_ID=nodo-1
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cooperativa_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - CACHE_SILLAS_TTL_SECONDS=240
      - CACHE_VIAJES_TTL_SECONDS=300
      - CACHE_LOCK_TIMEOUT_MILLIS=5000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - transporte_net
    restart: unless-stopped

  api-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transporte_api_node_2
    environment:
      - INSTANCE_ID=nodo-2
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cooperativa_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - CACHE_SILLAS_TTL_SECONDS=240
      - CACHE_VIAJES_TTL_SECONDS=300
      - CACHE_LOCK_TIMEOUT_MILLIS=5000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - transporte_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 4. Balanceador de Carga Automático (Nginx Reverse Proxy) - ADR-001
  # --------------------------------------------------------------------------
  load-balancer:
    image: nginx:alpine
    container_name: transporte_load_balancer
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-node-1
      - api-node-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - transporte_net
    restart: unless-stopped

networks:
  transporte_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
