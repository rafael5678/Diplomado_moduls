# Conexión por defecto: MongoDB.

spring.application.name=cooperativa-reservas

# Server Configuration
server.port=8080

# MongoDB Configuration (Adaptador de Salida - Persistencia NoSQL)
# Base local cooperativa_reservas, puerto 27017.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/cooperativa_reservas}
spring.data.mongodb.auto-index-creation=true

# Logging Configuration
# Detalle del paquete de la cooperativa.
logging.level.co.edu.ucc.cooperativa=DEBUG
# Formato: fecha, hilo, nivel, clase y mensaje.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
