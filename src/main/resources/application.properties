# Arranque normal del módulo de reservas. La base que usa es MongoDB.
# MySQL no entra aquí: solo si se activa el perfil mysql.

spring.application.name=cooperativa-reservas

# Server Configuration
server.port=8080

# MongoDB Configuration (Adaptador de Salida - Persistencia NoSQL)
# Conexión a Mongo. Base cooperativa_reservas en el puerto 27017. Si existe MONGO_URI, usa esa.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/cooperativa_reservas}
spring.data.mongodb.auto-index-creation=true

# Logging Configuration
# Deja en DEBUG el paquete de la cooperativa para ver más detalle en consola.
logging.level.co.edu.ucc.cooperativa=DEBUG
# Formato de cada línea: fecha, hilo, nivel, clase y mensaje.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
