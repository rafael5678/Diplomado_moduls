spring.application.name=modulo-cache-lecturas

# Server Configuration
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cooperativa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration (Resilient timeouts & connection)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ADR-002: Cache Configuration
# TTL: 240 seconds (4 minutes, within 180s - 300s requirement)
cache.sillas.ttl-seconds=${CACHE_SILLAS_TTL_SECONDS:240}
cache.viajes.ttl-seconds=${CACHE_VIAJES_TTL_SECONDS:300}
cache.lock.timeout-millis=${CACHE_LOCK_TIMEOUT_MILLIS:5000}
cache.lock.retry-interval-millis=${CACHE_LOCK_RETRY_INTERVAL_MILLIS:50}
cache.lock.max-retries=${CACHE_LOCK_MAX_RETRIES:10}

# Logging Configuration
logging.level.com.example.modulocachelecturas=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ADR-001: Actuator & Health Monitoring (ASR 1)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true
instance.id=${INSTANCE_ID:instancia-default}
