# Conexión MySQL. Solo con el perfil mysql.

# Configuración de Persistencia Relacional MySQL (Adaptador de Salida JPA)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cooperativa_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# Usuario.
spring.datasource.username=${MYSQL_USER:root}
# Contraseña.
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Actualiza las tablas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL en consola.
spring.jpa.show-sql=true
# SQL en varias líneas.
spring.jpa.properties.hibernate.format_sql=true
# SQL compatible con MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
