# Perfil mysql. Solo aplica al arrancar con --spring.profiles.active=mysql.
# Ahí las reservas se guardan en MySQL, no en la configuración de Mongo.

# Configuración de Persistencia Relacional MySQL (Adaptador de Salida JPA)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cooperativa_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# Usuario de MySQL. MYSQL_USER lo reemplaza; si no existe, entra como root.
spring.datasource.username=${MYSQL_USER:root}
# Contraseña. MYSQL_PASSWORD la reemplaza; si no existe, usa root.
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# update crea o ajusta las tablas y no borra los datos que ya están.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que Hibernate manda a MySQL.
spring.jpa.show-sql=true
# Ese SQL sale ordenado en varias líneas para poder leerlo.
spring.jpa.properties.hibernate.format_sql=true
# Dialecto de MySQL: Hibernate genera SQL compatible con ese motor.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
