events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging optimizado para auditoría de latencia y p95
    log_format p95_metrics '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           'upstream: $upstream_addr '
                           'request_time: $request_time '
                           'upstream_response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log p95_metrics;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones de conexión para alta concurrencia (16.000 tiquetes/día)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresión gzip para reducir el consumo de ancho de banda móvil
    gzip on;
    gzip_types application/json text/plain text/css application/xml;

    # Pool de réplicas en alta disponibilidad (least_conn para distribución equitativa)
    upstream backend_transporte {
        least_conn;
        server api-node-1:8080 max_fails=2 fail_timeout=5s;
        server api-node-2:8080 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck global del balanceador
        location /lb-health {
            access_log off;
            return 200 '{"status":"UP","component":"NGINX_LOAD_BALANCER","policy":"least_conn","replicas":2}\n';
            add_header Content-Type application/json;
        }

        # Proxy hacia las réplicas con tolerancia a fallos inmediata (failover < 1s)
        location / {
            proxy_pass http://backend_transporte;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si un nodo falla o responde 502/503/504, reintentar de inmediato en el siguiente
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;

            # Timeouts para cumplir p95 < 3s en consultas y p95 < 5s en compras
            proxy_connect_timeout 2s;
            proxy_send_timeout 4s;
            proxy_read_timeout 4s;

            # Header que expone qué nodo procesó la petición (para verificar balanceo)
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Response-Time $upstream_response_time always;
        }
    }
}
